name: 2023 tests

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/2023.yml"
      - ".github/workflows/go.yml"
      - "go/framework/**"
      - "go/2023/**"
  pull_request:
    paths:
      - ".github/workflows/2023.yml"
      - ".github/workflows/go.yml"
      - "go/framework/**"
      - "go/2023/**"
  workflow_dispatch:

jobs:
  run-workflow:
    uses: ./.github/workflows/go.yml
    with:
      year: 2023